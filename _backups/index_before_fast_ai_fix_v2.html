<script id="geonexa-camera">

window.geonexaCapturePhoto =
async function () {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    alert(
      "Camera is not available in this browser."
    );

    return "";
  }


  let stream;

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

  } catch (error) {

    alert(
      "Camera permission is blocked. Please allow camera access in Chrome."
    );

    return "";
  }


  return await new Promise(
    function(resolve) {

      const overlay =
        document.createElement("div");

      overlay.style.position =
        "fixed";

      overlay.style.inset =
        "0";

      overlay.style.zIndex =
        "999999";

      overlay.style.background =
        "rgba(0,0,0,.88)";

      overlay.style.display =
        "flex";

      overlay.style.alignItems =
        "center";

      overlay.style.justifyContent =
        "center";


      const panel =
        document.createElement("div");

      panel.style.width =
        "min(94vw,700px)";

      panel.style.background =
        "#061724";

      panel.style.padding =
        "14px";

      panel.style.borderRadius =
        "18px";

      panel.style.border =
        "1px solid #2a6d67";

      panel.style.boxShadow =
        "0 20px 60px rgba(0,0,0,.5)";


      const title =
        document.createElement("div");

      title.innerText =
        "GEONEXA Camera";

      title.style.color =
        "#5de0b5";

      title.style.fontWeight =
        "800";

      title.style.fontSize =
        "18px";

      title.style.marginBottom =
        "10px";


      const video =
        document.createElement("video");

      video.autoplay =
        true;

      video.playsInline =
        true;

      video.muted =
        true;

      video.style.width =
        "100%";

      video.style.maxHeight =
        "65vh";

      video.style.objectFit =
        "cover";

      video.style.background =
        "#000";

      video.style.borderRadius =
        "14px";


      const buttons =
        document.createElement("div");

      buttons.style.display =
        "flex";

      buttons.style.justifyContent =
        "center";

      buttons.style.gap =
        "12px";

      buttons.style.marginTop =
        "14px";


      const capture =
        document.createElement("button");

      capture.innerText =
        "Take photo";

      capture.style.padding =
        "12px 24px";

      capture.style.border =
        "0";

      capture.style.borderRadius =
        "12px";

      capture.style.background =
        "#5de0b5";

      capture.style.color =
        "#04151e";

      capture.style.fontWeight =
        "800";

      capture.style.cursor =
        "pointer";


      const cancel =
        document.createElement("button");

      cancel.innerText =
        "Cancel";

      cancel.style.padding =
        "12px 24px";

      cancel.style.borderRadius =
        "12px";

      cancel.style.border =
        "1px solid #5de0b5";

      cancel.style.background =
        "transparent";

      cancel.style.color =
        "#ffffff";

      cancel.style.fontWeight =
        "700";

      cancel.style.cursor =
        "pointer";


      function cleanup() {

        if (stream) {

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }

        overlay.remove();

      }


      capture.onclick =
      function() {

        if (
          !video.videoWidth ||
          !video.videoHeight
        ) {
          return;
        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        const context =
          canvas.getContext("2d");


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const result =
          canvas.toDataURL(
            "image/jpeg",
            0.82
          );


        cleanup();

        resolve(result);

      };


      cancel.onclick =
      function() {

        cleanup();

        resolve("");

      };


      panel.appendChild(title);
      panel.appendChild(video);
      buttons.appendChild(capture);
      buttons.appendChild(cancel);
      panel.appendChild(buttons);
      overlay.appendChild(panel);

      document.body.appendChild(
        overlay
      );


      video.srcObject =
        stream;


      video.play().catch(
        function() {}
      );

    }
  );
};

</script>
<script type="module" id="geonexa-web-ai">

import {
  pipeline,
  RawImage,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

env.allowRemoteModels = true;

/*
  One WASM thread is more compatible
  across normal Chrome/Netlify pages.
*/
if (
  env.backends &&
  env.backends.onnx &&
  env.backends.onnx.wasm
) {
  env.backends.onnx.wasm.numThreads = 1;
}


let classifierPromise = null;


async function getClassifier() {

  if (!classifierPromise) {

    classifierPromise =
      pipeline(
        "zero-shot-image-classification",
        "Xenova/mobileclip_s0",
        {
          dtype: "uint8"
        }
      );

  }

  return classifierPromise;

}


const hazards = [

  {
    key: "LANDSLIDE",
    label:
      "a landslide or mudslide disaster",
    name:
      "Landslide / mudslide"
  },

  {
    key: "ROCKFALL",
    label:
      "a rockfall or collapsed mountain slope",
    name:
      "Rockfall / slope collapse"
  },

  {
    key: "FLOOD",
    label:
      "a flood or flash flood disaster",
    name:
      "Flood / flash flood"
  },

  {
    key: "WILDFIRE",
    label:
      "a wildfire or forest fire disaster",
    name:
      "Wildfire / fire"
  },

  {
    key: "STORM",
    label:
      "severe cyclone storm tornado or wind damage",
    name:
      "Storm / cyclone damage"
  },

  {
    key: "EARTHQUAKE",
    label:
      "earthquake destruction collapsed buildings or disaster rubble",
    name:
      "Earthquake / structural damage"
  }

];


const normalImages = [

  {
    key: "PERSON",
    label:
      "a normal photo of people faces friends or a selfie",
    name:
      "Person / selfie photo"
  },

  {
    key: "SCREENSHOT",
    label:
      "a computer screen software coding or application screenshot",
    name:
      "Computer / screenshot image"
  },

  {
    key: "FOOD",
    label:
      "a normal food meal drink or restaurant photograph",
    name:
      "Food / everyday image"
  },

  {
    key: "ANIMAL",
    label:
      "a normal pet dog cat bird or animal photograph",
    name:
      "Animal / pet image"
  },

  {
    key: "OBJECT",
    label:
      "an ordinary indoor object phone book furniture or document",
    name:
      "Everyday object image"
  },

  {
    key: "NORMAL",
    label:
      "a normal safe road building landscape or outdoor scene with no disaster",
    name:
      "Normal non-disaster scene"
  }

];


const severityLabels = [
  "minor localized hazard with little visible damage",
  "moderate dangerous hazard with clear visible damage",
  "severe life threatening disaster with major destruction"
];


window.geonexaClassifyPhoto =
async function(imageData) {

  try {

    /*
      Decode the uploaded data URL as a real
      browser image before giving it to CLIP.
    */

    const response =
      await fetch(imageData);

    const blob =
      await response.blob();

    const image =
      await RawImage.fromBlob(blob);


    const classifier =
      await Promise.race([

        getClassifier(),

        new Promise(
          (_, reject) =>
            setTimeout(
              () => reject(
                new Error(
                  "AI model loading timed out"
                )
              ),
              55000
            )
        )

      ]);


    const candidates = [
      ...hazards.map(
        x => x.label
      ),
      ...normalImages.map(
        x => x.label
      )
    ];


    const output =
      await classifier(
        image,
        candidates
      );


    if (
      !Array.isArray(output) ||
      output.length === 0
    ) {

      return JSON.stringify({
        ok: false,
        message:
          "No reliable AI result."
      });

    }


    const sorted =
      [...output].sort(
        (a, b) =>
          Number(b.score) -
          Number(a.score)
      );


    const bestHazard =
      sorted.find(
        result =>
          hazards.some(
            item =>
              item.label ===
              result.label
          )
      );


    const bestNormal =
      sorted.find(
        result =>
          normalImages.some(
            item =>
              item.label ===
              result.label
          )
      );


    const hazardScore =
      Number(
        bestHazard?.score || 0
      );


    const normalScore =
      Number(
        bestNormal?.score || 0
      );


    const hazardInfo =
      bestHazard
        ? hazards.find(
            x =>
              x.label ===
              bestHazard.label
          )
        : null;


    /*
      Conservative validation.

      GEONEXA rejects uncertain images
      rather than falsely calling them
      disasters.
    */

    const valid =
      hazardInfo !== null &&
      hazardScore >= 0.28 &&
      hazardScore >
        normalScore + 0.04;


    if (!valid) {

      const normalInfo =
        bestNormal
          ? normalImages.find(
              x =>
                x.label ===
                bestNormal.label
            )
          : null;


      return JSON.stringify({

        ok: true,

        valid: false,

        type:
          normalInfo?.name ||
          "Other / non-disaster image",

        key:
          normalInfo?.key ||
          "INVALID",

        confidence:
          Math.max(
            normalScore,
            hazardScore
          ),

        severity: "",

        severityConfidence: 0,

        message:
          "Please upload a valid disaster image."

      });

    }


    /*
      Visual severity screening.
    */

    const severityOutput =
      await classifier(
        image,
        severityLabels
      );


    let severity =
      "LOW";

    let severityConfidence =
      0;


    if (
      Array.isArray(severityOutput) &&
      severityOutput.length > 0
    ) {

      const bestSeverity =
        [...severityOutput].sort(
          (a, b) =>
            Number(b.score) -
            Number(a.score)
        )[0];


      severityConfidence =
        Number(
          bestSeverity.score || 0
        );


      if (
        bestSeverity.label.startsWith(
          "severe"
        )
      ) {

        severity =
          "HIGH";

      } else if (
        bestSeverity.label.startsWith(
          "moderate"
        )
      ) {

        severity =
          "MEDIUM";

      }

    }


    return JSON.stringify({

      ok: true,

      valid: true,

      type:
        hazardInfo.name,

      key:
        hazardInfo.key,

      confidence:
        hazardScore,

      severity:
        severity,

      severityConfidence:
        severityConfidence

    });


  } catch (error) {

    console.error(
      "GEONEXA WEB AI ERROR:",
      error
    );


    return JSON.stringify({

      ok: false,

      message:
        String(
          error?.message ||
          error ||
          "AI model load failed"
        )

    });

  }

};

</script>
</body>
</html>
